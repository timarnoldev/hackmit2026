<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Erbgut social preview</title>
<!-- Source for social-preview.png. Render at exactly 1280x640:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu \
       --hide-scrollbars --window-size=1280,640 \
       --screenshot=marketing/social/social-preview.png marketing/social/social-preview.html
     Fonts are the deck's own woff2 files, so this needs no network. -->
<style>
@font-face {
  font-family: "SA Sans";
  src: url("../deck/fonts/InstrumentSans-latin.woff2") format("woff2");
  font-weight: 400 700;
}
@font-face {
  font-family: "SA Mono";
  src: url("../deck/fonts/JetBrainsMono-latin.woff2") format("woff2");
  font-weight: 400 600;
}
:root {
  --sa-paper: #EAF3ED;
  --sa-ink: #08130B;
  --sa-muted: #3E6B52;
  --sa-rule: #C3D9C9;
  --sa-audit: #0B6E82;
  --sa-cost: #C41477;
  --sa-gain: #0A7A41;
  --sa-tbd: #8A7A00;
  --sans: "SA Sans", "Instrument Sans", Helvetica, Arial, sans-serif;
  --mono: "SA Mono", "JetBrains Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
body {
  background: var(--sa-paper);
  color: var(--sa-ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  padding: 64px 72px 56px;
  display: flex;
  flex-direction: column;
}

.brandrow { display: flex; align-items: center; gap: 18px; }
.brandrow svg { width: 68px; height: 68px; flex: none; }
.wordmark { font-size: 61px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }

h1 {
  margin: 44px 0 0;
  font-size: 56px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.12;
  max-width: 1130px;
}
h1 em { font-style: normal; color: var(--sa-gain); }

/* the strand specimen, with a dimension bracket over the run the hand rule polices */
.specimen { margin-top: 58px; position: relative; padding-top: 30px; }
.seq { font-family: var(--mono); font-weight: 600; font-size: 34px; letter-spacing: 0; white-space: nowrap; }
.nt { display: inline-block; width: 0.78em; text-align: center; }
.nt-A { color: var(--sa-audit); }
.nt-C { color: var(--sa-cost); }
.nt-G { color: var(--sa-gain); }
.nt-T { color: var(--sa-tbd); }
.dim {
  position: absolute;
  top: 8px;
  height: 13px;
  border: 3px solid var(--sa-audit);
  border-bottom: 0;
}
.dim span {
  position: absolute;
  left: 50%;
  bottom: calc(100% + 7px);
  transform: translateX(-50%);
  font-size: 16px;
  font-weight: 600;
  line-height: 1;
  color: var(--sa-audit);
  white-space: nowrap;
  letter-spacing: 0;
}

.stats { margin-top: auto; display: flex; align-items: flex-end; gap: 56px; }
.stat { border-top: 3px solid var(--sa-rule); padding-top: 12px; }
.stat .n { font-size: 42px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; white-space: nowrap; }
.stat .n .was { color: var(--sa-muted); }
.stat .n .arrow { color: var(--sa-muted); font-weight: 400; padding: 0 10px; }
.stat .n .now { color: var(--sa-gain); }
.stat .d { font-size: 17px; color: var(--sa-muted); margin-top: 6px; }
.event { margin-left: auto; font-size: 20px; color: var(--sa-muted); padding-bottom: 4px; }
</style>
</head>
<body>

<div class="brandrow">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <path d="M1.5 32C11.56 13.04 23.77 8 32 8C40.23 8 52.44 13.04 62.5 32" fill="none" stroke="#32C7DB" stroke-width="9" stroke-linecap="round"/>
    <path d="M1.5 32C11.56 50.96 23.77 56 32 56C40.23 56 52.44 50.96 62.5 32" fill="none" stroke="#32C7DB" stroke-width="9" stroke-linecap="round"/>
    <rect x="10.5" y="18" width="10.5" height="28" rx="5.25" fill="#FEC746"/>
    <rect x="26.75" y="11" width="10.5" height="42" rx="5.25" fill="#FC68D6"/>
    <rect x="43" y="18" width="10.5" height="28" rx="5.25" fill="#5BD67C"/>
  </svg>
  <div class="wordmark">Erbgut</div>
</div>

<h1>Does that DNA coding rule actually pay off on your channel? <em>We measure it.</em></h1>

<div class="specimen">
  <div class="seq" id="seq"></div>
  <div class="dim" id="dim"><span>rule under audit</span></div>
</div>

<div class="stats">
  <div class="stat">
    <div class="n"><span class="was">19.5</span><span class="arrow">&#8594;</span><span class="now">5.5</span></div>
    <div class="d">reads per strand, Nanopore</div>
  </div>
  <div class="stat">
    <div class="n"><span class="was">67</span><span class="arrow">&#8594;</span><span class="now">88%</span></div>
    <div class="d">strands decoded exactly, real held-out data</div>
  </div>
  <div class="stat">
    <div class="n">300</div>
    <div class="d">held-out trials per number</div>
  </div>
  <div class="event">HackMIT 2026</div>
</div>

<script>
// The run of four G is what the best known hand rule polices. The bracket sits over it.
const SEQ = "ACTGAGGGGTCAAGCTTAGCCACTGAGGGGTCAAGC";
const RUN_START = 5, RUN_LEN = 4;
const seq = document.getElementById("seq");
seq.innerHTML = [...SEQ].map((c) => `<span class="nt nt-${c}">${c}</span>`).join("");
const cells = seq.children;
const a = cells[RUN_START].getBoundingClientRect();
const b = cells[RUN_START + RUN_LEN - 1].getBoundingClientRect();
const base = seq.getBoundingClientRect();
const dim = document.getElementById("dim");
dim.style.left = (a.left - base.left + 2) + "px";
dim.style.width = (b.right - a.left - 4) + "px";
</script>

</body>
</html>
