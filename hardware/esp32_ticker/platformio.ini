; Erbgut live decode ticker, ESP32-S3-BOX-3 firmware.
;
; The box is a thin display. It gets everything over the USB cable as line delimited JSON
; from scripts/ticker_server.py. There is no WiFi in this firmware on purpose: a stage demo
; must not depend on hackathon WiFi.
;
; Build and flash:   pio run -t upload
; Watch the box:     pio device monitor          (see README, the monitor holds the port)

[common]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
; ESP32-S3-WROOM-1 N16R8 on the BOX-3: 16 MB quad flash, 8 MB octal PSRAM.
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; The box enumerates as an Espressif "USB JTAG/serial debug unit", so Serial is the native
; USB CDC on that same port. No UART bridge, no baud rate that matters.
build_flags =
  -O3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DLGFX_USE_V1
  -DCORE_DEBUG_LEVEL=0

lib_deps =
  lovyan03/LovyanGFX@^1.1.16
  bblanchon/ArduinoJson@^7.0.4

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; The ticker firmware.
[env:esp32-s3-box-3]
extends = common
build_src_filter = +<*> -<diag.cpp>

; Display bring-up sweep, see src/diag.cpp. One configuration per boot.
;   pio run -e diag -t upload --upload-port /dev/cu.usbmodem1101
[env:diag]
extends = common
build_src_filter = +<diag.cpp>
